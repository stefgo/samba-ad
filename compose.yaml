services:

  samba-dc:
    build: ./docker
    image: ghcr.io/stefgo/samba-ad:latest
    container_name: samba-dc
    restart: unless-stopped
    network_mode: host
    # Samba stores NT ACLs (e.g. for sysvol) in security.* xattrs
    cap_add:
      - SYS_ADMIN
    # Normal operation: the DC is its own DNS server.
    # init.sh points SAMBA_DNS_SERVER to the peer during a join.
    dns:
      - ${SAMBA_DNS_SERVER:-${SAMBA_HOST_ADDRESS}}
    dns_search:
      - ${SAMBA_REALM}
    extra_hosts:
      - ${SAMBA_HOST_NAME}.${SAMBA_REALM} ${SAMBA_HOST_NAME}:${SAMBA_HOST_ADDRESS}
    environment:
      PEER_SERVER: ${SAMBA_PEER_SERVER:-}
      INTERFACES: ${SAMBA_INTERFACE:-}
      REALM: ${SAMBA_REALM:-HOME.LAN}
      TZ: ${TZ:-UTC}
      WORKGROUP: ${WORKGROUP:-HOME}
      BIND_HOST_IP: ${SAMBA_HOST_ADDRESS}
      BIND_VIRTUAL_IPS: ${SAMBA_VIRTUAL_ADDRESS:-}
      BIND_INTERFACES_ONLY: ${SAMBA_BIND_INTERFACES_ONLY:-yes}
      DNS_FORWARDER: ${SAMBA_DNS_FORWARDER:-}
    volumes:
      # Optional custom certificate: cert.pem, key.pem and ca.pem
      - ./tls:/tls:ro
      - samba-ad-etc:/etc/samba
      - samba-ad-lib:/var/lib/samba
      - samba-bind:/var/bind

volumes:
  samba-ad-etc:
    name: samba-dc-etc
  samba-ad-lib:
    name: samba-dc-lib
  samba-bind:
    name: samba-dc-bind
