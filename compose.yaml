# The domain controller. Its settings come from .env (template: .env.example).
# Documentation: https://stefgo.github.io/samba-ad/

services:
  samba-dc:
    image: ghcr.io/stefgo/samba-ad:${SAMBA_IMAGE_TAG:-latest}
    container_name: samba-dc
    restart: unless-stopped
    # Samba and BIND serve the addresses of the host directly
    network_mode: host
    # Samba stores NT ACLs (e.g. of the sysvol) in security.* xattrs
    cap_add:
      - SYS_ADMIN
    # The domain controller is its own DNS server
    dns:
      - ${SAMBA_HOST_ADDRESS:?set it in .env - template .env.example}
    dns_search:
      - ${SAMBA_REALM:?set it in .env - template .env.example}
    env_file:
      - .env
      # Optional: the Cloudflare API token for Let's Encrypt
      - path: acme.env
        required: false
    # Time for Samba to close its databases
    stop_grace_period: 30s
    volumes:
      - samba-dc-etc:/etc/samba
      - samba-dc-lib:/var/lib/samba
      # Optional own certificate: cert.pem, key.pem, ca.pem
      - ./tls:/tls:ro
      # Let's Encrypt account and certificates; on the host, so that init.sh
      # does not delete them
      - ./letsencrypt:/var/lib/acme
      # Settings of the SADM agent; writable, the agent may store serverUrl
      - ./sadm-config.yaml:/etc/sadm-client/config.yaml
      # Archives of the backup command
      - ./backup:/backup

volumes:
  samba-dc-etc:
    name: samba-dc-etc
  samba-dc-lib:
    name: samba-dc-lib
