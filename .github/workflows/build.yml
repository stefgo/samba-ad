name: Image bauen und bereitstellen

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/build.yml
  schedule:
    # Wöchentlicher Neubau, damit Debian- und Samba-Updates ins Image kommen
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, trixie-backports]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.suite }}
            type=raw,value=${{ matrix.suite }}-{{date 'YYYYMMDD'}}
            type=raw,value=latest,enable=${{ matrix.suite == 'trixie-backports' }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: SAMBA_SUITE=${{ matrix.suite }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
