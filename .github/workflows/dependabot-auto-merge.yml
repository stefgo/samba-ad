# Dependabot's answer to an outdated action is a pull request, and this
# repository is maintained without pull requests. An update that is opened and
# never merged is not a slower update, it is none.
#
# The gate is the pull request's own checks: this workflow starts when its
# Check Code run has finished, and merges once every check of the pull request
# has passed. A red run leaves the pull request open and visible, which is the
# case that wants a human anyway.
#
# Deliberately not "gh pr merge --auto": without branch protection there are no
# required checks for auto-merge to wait on, and it merges immediately. A
# ruleset that requires checks would also stop the release workflow's own push
# to main, and a personal account cannot exempt GitHub Actions from it.
name: Merge Dependency Updates

on:
  workflow_run:
    workflows: [Check Code]
    types: [completed]

permissions:
  contents: read

# Per pull request, one after the other: when two runs finish together, the
# second finds the pull request merged and stops.
concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    # Only a green run, only for a pull request, only Dependabot's. Anything
    # else is skipped rather than failed.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    name: Merge once the checks are green
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request
      pull-requests: write
      actions: write # start build.yml
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The number, or the branch where GitHub leaves the list empty
          PR=${PR_NUMBER:-$BRANCH}
          if [ "$(gh pr view "$PR" --json state --jq .state)" != OPEN ]; then
            echo "Pull request $PR is no longer open."
            exit 0
          fi
          # Every check of the pull request, not only the run that started this
          # one. While another still runs, the run that finishes last merges.
          if ! gh pr checks "$PR"; then
            echo "Not every check of $PR has passed (yet); nothing merged."
            exit 0
          fi
          # --match-head-commit: if Dependabot has rebased the branch since, the
          # merge is refused and the runs for the new head decide.
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"
          # A merge with this token starts no workflow, so the image and its
          # smoke test would only be built on the next push. Started here.
          gh workflow run build.yml --ref main
