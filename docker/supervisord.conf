[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:bind]
command=/usr/sbin/named -4 -g
priority=1
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:samba]
command=bash -c "sleep 2 && /usr/sbin/samba --model=%(ENV_MODEL)s -i"
; After BIND (1) and before the SADM agent (10)
priority=5
startsecs=3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

; Further programs, e.g. the SADM agent written by entrypoint.sh
[include]
files = /etc/supervisor/conf.d/*.conf
