; Obtains and renews the Let's Encrypt certificate of the virtual LDAP addresses.
; entrypoint.sh adds it to /etc/supervisor/conf.d/optional.conf with
; SAMBA_LETSENCRYPT=yes only.
[program:letsencrypt]
command=/usr/local/bin/letsencrypt.sh run
; After Samba (5) and haproxy (6): haproxy starts with whatever certificate
; it has
priority=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
