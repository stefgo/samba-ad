; LDAP and the Global Catalog on the virtual addresses, LDAPS with the Let's
; Encrypt certificate if there is one. entrypoint.sh adds it to
; /etc/supervisor/conf.d/optional.conf with SAMBA_VIRTUAL_ADDRESSES only.
; Master-worker mode (-W): USR2 loads a new certificate without closing open
; connections.
[program:vip-proxy]
command=/usr/sbin/haproxy -W -db -f /etc/haproxy/haproxy.cfg
; After Samba (5), before Let's Encrypt (15)
priority=6
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
