; supervisord runs BIND and Samba, and the optional programs that
; entrypoint.sh writes to /etc/supervisor/conf.d/optional.conf. All output
; goes to the container log.

; Used by supervisorctl and the SADM agent. supervisord warns (CRIT) that it
; has no HTTP authentication: only root inside the container can reach it.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; As user bind, like Debian's own service; Samba gives the group bind access
; to what BIND needs
[program:bind]
command=/usr/sbin/named -4 -g -u bind
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:samba]
command=/usr/local/lib/samba-ad/start-samba.sh
; After BIND (1), before haproxy (6), the SADM agent (10) and Let's
; Encrypt (15)
priority=5
startsecs=5
; Time to close the databases; compose.yaml allows 30 seconds in all
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Stops the container when BIND or Samba cannot be started, so that Docker
; restarts it and the cause stands at the end of the log
[eventlistener:fatal]
command=/usr/local/lib/samba-ad/supervisor-fatal.sh
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files = /etc/supervisor/conf.d/*.conf
